name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 3 -iname "*.zip" | head -n1)
          echo "Found: $ZIP"
          unzip -q "$ZIP" -d project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build debug APK
        run: |
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -n1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AppLock-debug
          path: project/**/app-debug.apk
